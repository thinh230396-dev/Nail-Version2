name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Bộ kiểm thử chạy trên SQL Server thật chứ không phải InMemory (xem SalonSysFactory),
    # nên CI cũng dựng một SQL Server thật. Mật khẩu này chỉ sống trong container tạm của CI.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci_Passw0rd!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Ci_Passw0rd!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      NAILMANAGEMENT_TEST_DB: "Server=localhost,1433;Database=NailManagementTests;User Id=sa;Password=Ci_Passw0rd!;MultipleActiveResultSets=true;TrustServerCertificate=True"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Kiểm tra model khớp migration
        run: |
          dotnet tool install --global dotnet-ef
          dotnet ef migrations has-pending-model-changes \
            --project NailManagement.Infrastructure \
            --startup-project NailManagement.API \
            --configuration Release --no-build

      - name: Test
        run: >-
          dotnet test --no-build --configuration Release
          --logger "trx;LogFileName=results.trx"
          --collect:"XPlat Code Coverage"

      - name: Lưu kết quả kiểm thử
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/**"

  # Máy phát triển không có Docker, nên đây là nơi duy nhất Dockerfile được kiểm. Chỉ build,
  # không đẩy ảnh đi đâu.
  docker-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build ảnh máy chủ
        run: docker build --target runtime --tag salonsys-api:ci .

      - name: Build ảnh migration
        run: docker build --target migrator --tag salonsys-migrate:ci .
